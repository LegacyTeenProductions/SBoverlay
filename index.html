<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unified Softball Scorebug & Controller</title>
    <style>
        /* Base Viewport Canvas */
        html, body {
            background-color: transparent;
            margin: 0; padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            font-weight: 800; color: #ffffff;
            user-select: none; width: 100vw; height: 100vh; overflow: hidden;
        }

        /* 1. OPERATOR INTERFACE DECK (Top 50% of the screen) */
        #operator-deck {
            background-color: #161a1d;
            height: 50vh; width: 100vw;
            padding: 15px; box-sizing: border-box;
            border-bottom: 4px solid #ba181b;
            display: flex; flex-direction: column; justify-content: space-between;
        }
        h2 { margin: 0; color: #adb5bd; font-size: 16px; text-transform: uppercase; letter-spacing: 1px; }
        .control-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
        .card {
            background: #22252a; padding: 10px 14px; border-radius: 6px;
            display: flex; align-items: center; gap: 10px; border: 1px solid #2f343c;
        }
        .card-label { font-size: 12px; text-transform: uppercase; color: #adb5bd; }
        .team-input {
            background: #111; border: 1px solid #495057; color: #fff; padding: 6px;
            width: 55px; border-radius: 4px; font-weight: bold; text-transform: uppercase; text-align: center; font-size: 13px;
        }
        button {
            background-color: #343a40; color: #ffffff; border: 1px solid #495057;
            padding: 10px 18px; font-size: 15px; cursor: pointer; border-radius: 6px; font-weight: bold;
        }
        button:active { background-color: #495057; }
        .btn-add { background-color: #2b9348; border-color: #2b9348; }
        .btn-sub { background-color: #e63946; border-color: #e63946; }

        /* 2. BROADCAST LAYER (Bottom 50% of the screen) */
        #broadcast-canvas {
            display: flex; height: 50vh; width: 100vw; position: relative; background-color: transparent;
        }

        /* SCOREBUG GRAPHIC - Pinned precisely to bottom-left corner */
        .scorebug-container {
            display: flex; align-items: center;
            background-color: #0b0c10; border-radius: 4px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.7); height: 46px;
            overflow: hidden; border: 1px solid #1f2833;
            position: absolute; left: 30px; bottom: 30px; width: fit-content;
        }
        .team-block { display: flex; align-items: center; height: 100%; }
        .team-title { padding: 0 16px; font-size: 15px; letter-spacing: 1px; display: flex; align-items: center; height: 100%; }
        .away-team .team-title { background-color: #bd1f36; } 
        .home-team .team-title { background-color: #1f4ebd; } 
        .score-val { background-color: #1f232b; font-size: 22px; padding: 0 16px; display: flex; align-items: center; justify-content: center; min-width: 25px; height: 100%; }
        .data-segment { display: flex; align-items: center; justify-content: center; height: 100%; border-left: 1px solid #2d323f; padding: 0 14px; background-color: #151922; }
        .arrow-indicator { font-size: 12px; margin-right: 5px; color: #fca311; }
        
        /* Diamond base runners mapping */
        .diamond-wrap { position: relative; width: 24px; height: 24px; transform: rotate(45deg); }
        .base-pad { position: absolute; width: 9px; height: 9px; background-color: #454d5a; border: 1px solid #151922; }
        .base-pad.b-1 { top: 0; right: 0; }
        .base-pad.b-2 { top: 0; left: 0; }
        .base-pad.b-3 { bottom: 0; left: 0; }
        .base-pad.occupied { background-color: #fca311; box-shadow: 0 0 6px #fca311; }

        /* BSO Matrix Dots */
        .matrix-column { display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: #8d99ae; }
        .matrix-row { display: flex; align-items: center; }
        .row-header { width: 10px; font-size: 10px; font-weight: bold; }
        .dot-grid { display: flex; gap: 4px; margin-left: 6px; }
        .indicator-dot { width: 7px; height: 7px; border-radius: 50%; background-color: #3d4554; }
        .indicator-dot.b-active { background-color: #00f5d4; }
        .indicator-dot.s-active { background-color: #ff5400; }
        .indicator-dot.o-active { background-color: #fca311; }
    </style>
</head>
<body>

    <!-- IPAD CONTROL BOARD VIEW -->
    <div id="operator-deck">
        <h2>Softball Live Overlay Control Board</h2>
        <div class="control-row">
            <div class="card">
                <span class="card-label">Away Name:</span>
                <input type="text" class="team-input" id="input-away-name" value="AWY" maxlength="3" oninput="changeTeamName('away')">
                <button class="btn-sub" onclick="modifyScore('away', -1)">-</button>
                <button class="btn-add" onclick="modifyScore('away', 1)">+</button>
            </div>
            <div class="card">
                <span class="card-label">Home Name:</span>
                <input type="text" class="team-input" id="input-home-name" value="HOM" maxlength="3" oninput="changeTeamName('home')">
                <button class="btn-sub" onclick="modifyScore('home', -1)">-</button>
                <button class="btn-add" onclick="modifyScore('home', 1)">+</button>
            </div>
            <div class="card">
                <span class="card-label">Inning</span>
                <button onclick="shiftInningHalf()">Top/Bot</button>
                <button class="btn-sub" onclick="modifyInningNum(-1)">-</button>
                <button class="btn-add" onclick="modifyInningNum(1)">+</button>
            </div>
        </div>

        <div class="control-row">
            <div class="card">
                <span class="card-label">Plate Count</span>
                <button class="btn-add" onclick="registerCount('ball')">+ Ball</button>
                <button class="btn-add" onclick="registerCount('strike')">+ Strike</button>
                <button class="btn-sub" onclick="registerCount('out')">+ Out</button>
                <button onclick="wipeCount()">Clear Count</button>
            </div>
            <div class="card">
                <span class="card-label">Bases</span>
                <button id="ctrl-b1" onclick="invertBase(1)">1st</button>
                <button id="ctrl-b2" onclick="invertBase(2)">2nd</button>
                <button id="ctrl-b3" onclick="invertBase(3)">3rd</button>
                <button onclick="wipeBases()">Clear</button>
            </div>
        </div>
    </div>

    <!-- BROADCAST OUTPUT LAYER VIEW -->
    <div id="broadcast-canvas">
        <div class="scorebug-container">
            <div class="team-block away-team">
                <div class="team-title" id="disp-away-name">AWY</div>
                <div class="score-val" id="disp-away-score">0</div>
            </div>
            <div class="team-block home-team">
                <div class="team-title" id="disp-home-name">HOM</div>
                <div class="score-val" id="disp-home-score">0</div>
            </div>
            <div class="data-segment">
                <span class="arrow-indicator" id="disp-inning-arrow">&#9650;</span>
                <span id="disp-inning-num">1</span>
            </div>
            <div class="data-segment">
                <div class="diamond-wrap">
                    <div class="base-pad b-2" id="disp-base-2"></div>
                    <div class="base-pad b-1" id="disp-base-1"></div>
                    <div class="base-pad b-3" id="disp-base-3"></div>
                </div>
            </div>
            <div class="data-segment" style="min-width: 65px;">
                <div class="matrix-column">
                    <div class="matrix-row">
                        <span class="row-header">B</span>
                        <div class="dot-grid"><div class="indicator-dot" id="dot-b1"></div><div class="indicator-dot" id="dot-b2"></div><div class="indicator-dot" id="dot-b3"></div></div>
                    </div>
                    <div class="matrix-row">
                        <span class="row-header">S</span>
                        <div class="dot-grid"><div class="indicator-dot" id="dot-s1"></div><div class="indicator-dot" id="dot-s2"></div></div>
                    </div>
                </div>
            </div>
            <div class="data-segment">
                <div class="matrix-column">
                    <div class="matrix-row">
                        <span class="row-header">O</span>
                        <div class="dot-grid"><div class="indicator-dot" id="dot-o1"></div><div class="indicator-dot" id="dot-o2"></div></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- NATIVE ARCHITECTURE ENGINE -->
    <script>
        let gameState = { away: 0, home: 0, awayName: 'AWY', homeName: 'HOM', isTop: true, inning: 1, b: 0, s: 0, o: 0, runners: { 1: false, 2: false, 3: false } };
        
        function commit() { localStorage.setItem('local_softball_engine', JSON.stringify(gameState)); render(); }
        function pull() { const cache = localStorage.getItem('local_softball_engine'); if(cache) gameState = JSON.parse(cache); render(); }
        
        function modifyScore(team, delta) { gameState[team] = Math.max(0, gameState[team] + delta); commit(); }
        function changeTeamName(team) {
            if(team === 'away') gameState.awayName = document.getElementById('input-away-name').value.toUpperCase();
            else gameState.homeName = document.getElementById('input-home-name').value.toUpperCase();
            commit();
        }
        function shiftInningHalf() { gameState.isTop = !gameState.isTop; commit(); }
