<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YoloBox Broadcast Overlay Graphic</title>
    <style>
        html, body {
            background-color: transparent;
            margin: 0; padding: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
            font-weight: 800; color: #ffffff;
            user-select: none; width: 100vw; height: 100vh; overflow: hidden;
        }
        .scorebug-container {
            display: flex; align-items: center;
            background-color: #0b0c10; border-radius: 4px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.7); height: 46px;
            overflow: hidden; border: 1px solid #1f2833;
            position: absolute; left: 40px; bottom: 40px; width: fit-content;
        }
        .team-block { display: flex; align-items: center; height: 100%; }
        .team-title { padding: 0 16px; font-size: 15px; letter-spacing: 1px; display: flex; align-items: center; height: 100%; }
        .away-team .team-title { background-color: #bd1f36; }
        .home-team .team-title { background-color: #1f4ebd; }
        .score-val { background-color: #1f232b; font-size: 22px; padding: 0 16px; display: flex; align-items: center; justify-content: center; min-width: 25px; height: 100%; }
        .data-segment { display: flex; align-items: center; justify-content: center; height: 100%; border-left: 1px solid #2d323f; padding: 0 14px; background-color: #151922; }
        .arrow-indicator { font-size: 12px; margin-right: 5px; color: #fca311; }
        .diamond-wrap { position: relative; width: 24px; height: 24px; transform: rotate(45deg); }
        .base-pad { position: absolute; width: 9px; height: 9px; background-color: #454d5a; border: 1px solid #151922; }
        .base-pad.b-1 { top: 0; right: 0; }
        .base-pad.b-2 { top: 0; left: 0; }
        .base-pad.b-3 { bottom: 0; left: 0; }
        .base-pad.occupied { background-color: #fca311; box-shadow: 0 0 6px #fca311; }
        .matrix-column { display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: #8d99ae; }
        .matrix-row { display: flex; align-items: center; }
        .row-header { width: 10px; font-size: 10px; font-weight: bold; }
        .dot-grid { display: flex; gap: 4px; margin-left: 6px; }
        .indicator-dot { width: 7px; height: 7px; border-radius: 50%; background-color: #3d4554; }
        .indicator-dot.b-active { background-color: #00f5d4; }
        .indicator-dot.s-active { background-color: #ff5400; }
        .indicator-dot.o-active { background-color: #fca311; }
    </style>
</head>
<body>
    <div class="scorebug-container">
        <div class="team-block away-team"><div class="team-title" id="disp-away-name">AWY</div><div class="score-val" id="disp-away-score">0</div></div>
        <div class="team-block home-team"><div class="team-title" id="disp-home-name">HOM</div><div class="score-val" id="disp-home-score">0</div></div>
        <div class="data-segment"><span class="arrow-indicator" id="disp-inning-arrow">&#9650;</span><span id="disp-inning-num">1</span></div>
        <div class="data-segment"><div class="diamond-wrap"><div class="base-pad b-2" id="disp-base-2"></div><div class="base-pad b-1" id="disp-base-1"></div><div class="base-pad b-3" id="disp-base-3"></div></div></div>
        <div class="data-segment" style="min-width: 65px;"><div class="matrix-column"><div class="matrix-row"><span class="row-header">B</span><div class="dot-grid"><div class="indicator-dot" id="dot-b1"></div><div class="indicator-dot" id="dot-b2"></div><div class="indicator-dot" id="dot-b3"></div></div></div><div class="matrix-row"><span class="row-header">S</span><div class="dot-grid"><div class="indicator-dot" id="dot-s1"></div><div class="indicator-dot" id="dot-s2"></div></div></div></div></div>
        <div class="data-segment"><div class="matrix-column"><div class="matrix-row"><span class="row-header">O</span><div class="dot-grid"><div class="indicator-dot" id="dot-o1"></div><div class="indicator-dot" id="dot-o2"></div></div></div></div></div>
    </div>
    <script>
        function pull() {
            // Key aligned perfectly with control.html
            const cache = localStorage.getItem('yolo_softball_engine');
            if(!cache) return;
            const state = JSON.parse(cache);
            document.getElementById('disp-away-name').innerText = state.awayName;
            document.getElementById('disp-home-name').innerText = state.homeName;
            document.getElementById('disp-away-score').innerText = state.away;
            document.getElementById('disp-home-score').innerText = state.home;
            document.getElementById('disp-inning-num').innerText = state.inning;
            document.getElementById('disp-inning-arrow').innerHTML = state.isTop ? '&#9650;' : '&#9660;';
            for(let i=1; i<=3; i++) document.getElementById(`dot-b${i}`).classList.toggle('b-active', state.b >= i);
            for(let i=1; i<=2; i++) document.getElementById(`dot-s${i}`).classList.toggle('s-active', state.s >= i);
            for(let i=1; i<=2; i++) document.getElementById(`dot-o${i}`).classList.toggle('o-active', state.o >= i);
            for(let i=1; i<=3; i++) document.getElementById(`disp-base-${i}`).classList.toggle('occupied', state.runners[i]);
        }
        window.addEventListener('storage', pull);
        setInterval(pull, 200); // 200ms rapid local data monitoring loop
        pull();
    </script>
</body>
</html>
