<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPad Softball Scorebug Controller</title>
    <style>
        body {
            background-color: #161a1d;
            margin: 0; padding: 25px;
            font-family: 'Segoe UI', Roboto, sans-serif;
            font-weight: bold; color: #ffffff;
            user-select: none;
        }
        h2 { margin-top: 0; color: #adb5bd; font-size: 20px; text-transform: uppercase; letter-spacing: 1px; }
        .control-row { display: flex; gap: 20px; align-items: center; margin-bottom: 20px; flex-wrap: wrap; }
        .card {
            background: #22252a; padding: 16px 20px; border-radius: 10px;
            display: flex; align-items: center; gap: 15px; border: 1px solid #2f343c;
        }
        .card-label { font-size: 14px; text-transform: uppercase; color: #adb5bd; }
        .team-input {
            background: #111; border: 1px solid #495057; color: #fff; padding: 10px;
            width: 70px; border-radius: 6px; font-weight: bold;
            text-transform: uppercase; text-align: center; font-size: 16px;
        }
        button {
            background-color: #343a40; color: #ffffff; border: 1px solid #495057;
            padding: 14px 24px; font-size: 18px; cursor: pointer; border-radius: 8px; font-weight: bold;
        }
        button:active { background-color: #444; }
        .btn-add { background-color: #2b9348; border-color: #2b9348; }
        .btn-sub { background-color: #e63946; border-color: #e63946; }
    </style>
</head>
<body>

    <h2>iPad Local Controller Deck</h2>
    <div class="control-row">
        <div class="card">
            <span class="card-label">Away Name:</span>
            <input type="text" class="team-input" id="input-away-name" value="AWY" maxlength="3" oninput="changeTeamName('away')">
            <button class="btn-sub" onclick="modifyScore('away', -1)">-</button>
            <button class="btn-add" onclick="modifyScore('away', 1)">+</button>
        </div>
        <div class="card">
            <span class="card-label">Home Name:</span>
            <input type="text" class="team-input" id="input-home-name" value="HOM" maxlength="3" oninput="changeTeamName('home')">
            <button class="btn-sub" onclick="modifyScore('home', -1)">-</button>
            <button class="btn-add" onclick="modifyScore('home', 1)">+</button>
        </div>
        <div class="card">
            <span class="card-label">Inning</span>
            <button onclick="shiftInningHalf()">Top/Bot</button>
            <button class="btn-sub" onclick="modifyInningNum(-1)">-</button>
            <button class="btn-add" onclick="modifyInningNum(1)">+</button>
        </div>
    </div>

    <div class="control-row">
        <div class="card">
            <span class="card-label">Plate Count</span>
            <button class="btn-add" onclick="registerCount('ball')">+ Ball</button>
            <button class="btn-add" onclick="registerCount('strike')">+ Strike</button>
            <button class="btn-sub" onclick="registerCount('out')">+ Out</button>
            <button onclick="wipeCount()">Clear Count</button>
        </div>
        <div class="card">
            <span class="card-label">Bases</span>
            <button id="ctrl-b1" onclick="invertBase(1)">1st</button>
            <button id="ctrl-b2" onclick="invertBase(2)">2nd</button>
            <button id="ctrl-b3" onclick="invertBase(3)">3rd</button>
            <button onclick="wipeBases()">Clear</button>
        </div>
    </div>

    <script>
        let gameState = { away: 0, home: 0, awayName: 'AWY', homeName: 'HOM', isTop: true, inning: 1, b: 0, s: 0, o: 0, runners: { 1: false, 2: false, 3: false } };
        
        // Key aligned perfectly with index.html
        function commit() { localStorage.setItem('yolo_softball_engine', JSON.stringify(gameState)); render(); }
        function pull() { const cache = localStorage.getItem('yolo_softball_engine'); if(cache) gameState = JSON.parse(cache); render(); }
        
        // Repaired calculation line logic
        function modifyScore(team, delta) { gameState[team] = Math.max(0, gameState[team] + delta); commit(); }
        
        function changeTeamName(team) {
            if(team === 'away') gameState.awayName = document.getElementById('input-away-name').value.toUpperCase();
            else gameState.homeName = document.getElementById('input-home-name').value.toUpperCase();
            commit();
        }
        function shiftInningHalf() { gameState.isTop = !gameState.isTop; commit(); }
        function modifyInningNum(delta) { gameState.inning = Math.max(1, gameState.inning + delta); commit(); }
        
        function registerCount(action) {
            if(action === 'ball') { gameState.b++; if(gameState.b >= 4) { gameState.b = 0; gameState.s = 0; } }
            else if(action === 'strike') { gameState.s++; if(gameState.s >= 3) { gameState.b = 0; gameState.s = 0; incrementOut(); } }
            else if(action === 'out') { incrementOut(); }
            commit();
        }
        function incrementOut() { gameState.o++; if(gameState.o >= 3) { gameState.o = 0; gameState.b = 0; gameState.s = 0; gameState.runners = { 1: false, 2: false, 3: false }; } }
        function invertBase(num) { gameState.runners[num] = !gameState.runners[num]; commit(); }
        function wipeCount() { gameState.b = 0; gameState.s = 0; commit(); }
        function wipeBases() { gameState.runners = {1:false, 2:false, 3:false}; commit(); }

        function render() {
            document.getElementById('input-away-name').value = gameState.awayName;
            document.getElementById('input-home-name').value = gameState.homeName;
            for(let i=1; i<=3; i++) {
                const cBtn = document.getElementById(`ctrl-b${i}`);
                if(cBtn) cBtn.style.background = gameState.runners[i] ? '#fca311' : '#343a40';
            }
        }
        window.addEventListener('storage', pull);
        pull();
    </script>
</body>
</html>
